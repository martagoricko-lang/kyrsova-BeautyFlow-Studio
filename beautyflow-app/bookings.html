<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My bookings</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <a href="index.html" class="back-link">← Back</a>

      <h2 class="page-title">My bookings</h2>

      <div class="filter-buttons">
        <button id="future-bookings-btn" class="filter-btn">
          Show future bookings
        </button>

        <button id="reset-bookings-btn" class="filter-btn secondary-btn">
          Show all
        </button>
      </div>

      <p id="stream-status" class="stream-status"></p>
      <div id="bookings-list"></div>
      <div id="notification" class="notification hidden"></div>
    </div>

    <script type="module" src="bookings.js"></script>
    <div id="cancel-modal" class="cancel-modal hidden">
      <div class="cancel-modal-content">
        <h3>Cancel booking?</h3>

        <p>Are you sure you want to cancel this appointment?</p>

        <div class="cancel-modal-buttons">
          <button id="confirm-cancel-btn" class="confirm-btn">
            Yes, cancel
          </button>

          <button id="close-cancel-btn" class="keep-booking-btn">
            Keep booking
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
